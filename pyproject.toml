[project]
name = "Argus"
version = "0.1.0"
description = "A staged static analysis tool for finding security vulnerabilities in workflows"
authors = [
    {name = "Siddharth Muralee", email = "siddharth.muralee@gmail.com"}
]
license = "GPL-3"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pathlib (>=1.0.1,<2.0.0)",
    "click (>=8.1.3,<9.0.0)",
    "GitPython (>=3.1.41,<4.0.0)",
    "colorlog (>=6.7.0,<7.0.0)",
    "PyYAML (>=6.0,<7.0.0)",
    "sarif-om (>=1.0.4,<2.0.0)",
    "jschema-to-python (>=1.2.3,<2.0.0)",
    "setuptools (>=70.0.0,<71.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=1.0.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"
